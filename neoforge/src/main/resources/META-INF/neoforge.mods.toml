modLoader = "javafml"
loaderVersion = "[4,)"
license = "Apache-2.0"
issueTrackerURL = "https://github.com/ZerexaNet/cfmc-client/issues"

[[mods]]
modId = "cfmcclient"
version = "${version}"
displayName = "CFMC Client"
authors = "ZerexaNet"
description = '''
Cloudflare Minecraft Edge Server Client Mod.
WebSocket 传输 + 自定义二进制协议 + 多模式认证 + 全版本支持 (1.20.x/1.21.x).
'''
logoFile = "cfmc_icon.png"

[[mixins]]
config = "cfmc.client.mixins.json"

[[dependencies.cfmcclient]]
modId = "neoforge"
type = "required"
versionRange = "[20.4,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.cfmcclient]]
modId = "minecraft"
type = "required"
versionRange = "[1.20.4,1.22)"
ordering = "NONE"
side = "CLIENT"
