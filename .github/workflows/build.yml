# ============================================================================
# CFMC Client — GitHub Actions 自动打包
# ============================================================================
# 三种触发方式:
#   1. push 到 main            → 8 组合矩阵构建, jar 上传为 Actions Artifacts
#   2. pull_request / 手动触发  → 仅构建校验 (保护分支合入前的回归检查)
#   3. push tag (v0.2.0 这样)   → 矩阵构建 → 自动创建 GitHub Release 并附带
#                                全部 jar + SHA256 校验文件 (正式发布渠道)
#
# 全版本矩阵: fabric x 5 + neoforge x 3, 每个 (loader, mc) 组合独立 job,
# 某个版本失败不影响其余版本产物 (fail-fast: false)。
#
# 加新 MC 版本 (三处保持一致):
#   1. versions.gradle          → versionsTable 加一行
#   2. gradle.properties        → supported_versions 追加
#   3. 本文件                   → matrix include 加一行
# ============================================================================

name: build

on:
  push:
    branches: [main]
    tags: ['v*']        # v 开头的 tag 触发自动发布
  pull_request:
  workflow_dispatch:    # 允许在 Actions 页面手动触发

# release job 创建 Release 需要 contents:write 权限
permissions:
  contents: write

# 同一分支/tag 重复 push 时取消旧的构建, 节省 CI 时间
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Job 1: 全版本矩阵构建
  # ==========================================================================
  build:
    name: ${{ matrix.loader }} @ MC ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 某个版本失败不影响其他版本产物
      matrix:
        include:
          # ---- Fabric: 全版本 ----
          - { loader: fabric,   mc: 1.20.1 }
          - { loader: fabric,   mc: 1.20.4 }
          - { loader: fabric,   mc: 1.20.6 }
          - { loader: fabric,   mc: 1.21.1 }
          - { loader: fabric,   mc: 1.21.4 }
          # ---- NeoForge: 1.20.6+ (ModDevGradle 只支持 20.6+; 1.20.1 只有 Forge) ----
          - { loader: neoforge, mc: 1.20.6 }
          - { loader: neoforge, mc: 1.21.1 }
          - { loader: neoforge, mc: 1.21.4 }

    steps:
      - uses: actions/checkout@v4

      # 安装 JDK 21 (运行 Gradle 与构建 1.20.5+ 版本)。
      # 1.20.4 及以下需要的 JDK 17 由 Gradle 工具链 + foojay 解析器自动下载
      # (settings.gradle 已启用 foojay-resolver-convention)。
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Gradle 缓存加速 (依赖/重映射产物), 并校验 wrapper 完整性
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 使用仓库自带的 gradle wrapper (gradle-8.10.2), 免安装直接构建。
      # 产物命名: cfmc-client-<loader>-<mc>-<mod_version>.jar
      - name: Build ${{ matrix.loader }} @ MC ${{ matrix.mc }}
        run: >
          ./gradlew :${{ matrix.loader }}:build
          -Pmc_version=${{ matrix.mc }}
          --no-daemon --stacktrace

      # 把产物清单写入构建页顶部的 Job Summary, 一眼看清产出了哪些 jar
      - name: 生成构建摘要
        if: always()
        run: |
          echo "### ${{ matrix.loader }} @ ${{ matrix.mc }}" >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          jars=(${{ matrix.loader }}/build/libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "- (未产出 jar)" >> "$GITHUB_STEP_SUMMARY"
          else
            for j in "${jars[@]}"; do
              case "$j" in *-sources.jar) continue ;; esac
              echo "- \`$(basename "$j")\` ($(du -h "$j" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      # 每个组合独立 artifact: Actions 页面可直接下载对应版本的 jar
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cfmc-${{ matrix.loader }}-${{ matrix.mc }}
          path: |
            ${{ matrix.loader }}/build/libs/*.jar
            !${{ matrix.loader }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # Job 2: Tag 自动发布 (仅当 push 的 tag 以 v 开头时运行)
  #   1. 等待全部 9 个矩阵 job 成功 (任一失败则不发布, 避免残缺 Release)
  #   2. 汇总所有 jar → 生成 SHA256SUMS.txt → 创建 GitHub Release
  # ==========================================================================
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # merge-multiple: 把 9 个 artifact 的 jar 合并到同一目录
      # (文件名含 loader/mc 版本, 不会互相覆盖)
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 生成校验和供玩家验证下载完整性
      - name: 生成 SHA256 校验和
        working-directory: artifacts
        run: sha256sum *.jar > SHA256SUMS.txt

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CFMC Client ${{ github.ref_name }}
          body: |
            全版本矩阵构建产物 (Fabric x 5 + NeoForge x 4)

            ## 安装
            1. 选择与你 MC 版本和加载器匹配的 jar
               (命名规则: \`cfmc-client-<loader>-<mc_version>-<mod_version>.jar\`)
            2. 放入 \`.minecraft/mods/\`
            3. 启动游戏, 按 **P** 打开 CFMC 连接界面, 填入服务端地址

            ## 完整性校验
            \`\`\`bash
            sha256sum -c SHA256SUMS.txt
            \`\`\`

            服务端部署见 [cfmc-server DEPLOYMENT.md](https://github.com/ZerexaNet/cfmc-server/blob/main/DEPLOYMENT.md)
          files: |
            artifacts/*.jar
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
