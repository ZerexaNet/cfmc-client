# ============================================================================
# CFMC Client — Gradle 属性 (全版本支持)
# ============================================================================

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# ============================================================================
# ★ 全版本支持核心开关: 改这一行即可切换构建目标版本 ★
#    可选值见 versions.gradle 的版本表 (versionsTable 的 key)
#    CI 矩阵会对 supported_versions 里的每个版本逐一构建
# ============================================================================
mc_version=1.20.4

# 全部支持的 MC 版本 (scripts/build-all.sh 与 CI 读取)
supported_versions=1.20.1,1.20.4,1.20.6,1.21.1,1.21.4

# Mod 元数据
mod_version=0.2.0
maven_group=com.cfmc
archives_base_name=cfmc-client
