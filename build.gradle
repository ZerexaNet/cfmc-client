// ============================================================================
// CFMC Client — 根构建脚本 (全版本支持: 版本矩阵)
// ============================================================================
// 三个模块:
//   common/   纯 Java 核心 (协议/网络/认证/区块解码) — 零 MC 依赖, 恒定 Java 17
//   fabric/   Fabric 适配层 (yarn 映射)              — 随 mc_version 逐版本构建
//   neoforge/ NeoForge 适配层 (Mojang 官方映射)      — 随 mc_version 逐版本构建
//
// 切换目标版本:  gradle build -Pmc_version=1.21.4
// 全矩阵构建:   scripts/build-all.sh  (或 CI 的版本矩阵 job)
apply from: 'versions.gradle'

subprojects {
    apply plugin: 'java'

    group = project.maven_group
    version = project.mod_version

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // 构建 jar 名带 MC 版本: cfmc-client-fabric-1.20.4-0.2.0.jar
        // (fabric/neoforge 模块内覆写 archivesName, 此处统一设版本后缀)
    }

    // 产物命名: <loader>-<mc_version>-<mod_version>
    def mc = project.findProperty('mc_version') ?: '1.20.4'
    afterEvaluate {
        def loaderName = project.name == 'common' ? 'core' : project.name
        base {
            archivesName = "${project.archives_base_name}-${loaderName}-${mc}"
        }
    }
}
