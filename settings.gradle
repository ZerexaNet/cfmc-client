pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForge'; url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Java 工具链自动下载 (1.20.5+ 需要 JDK21, 本机只有 17 时也能构建)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'cfmc-client'

include 'common'
include 'fabric'
include 'neoforge'
